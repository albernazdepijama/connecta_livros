<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="home.css">
    <title>Praticando Java Script</title>
</head>
<body>

    <main>

        <h1>Praticando JS</h1>
        
   
    <section>

        <h2>Trocar um nome na tela</h2>
        <input type="text" id="nome-entrada" placeholder="Informe seu nome">
        <button id="btn-troca"> Trocar Nome</button>
        <p>Ola <b id="nome-saida"> Visitante </b>!</p>

    </section>

    <section>
        <h2>Alterando a cor da caixa </h2>
        <div id="caixa">Aqui a caixa </div>
        <button id="btn_rosa" class="btn"> Rosa</button>
        <button id="btn_preto" class="btn"> Preto</button>
        <button id="btn_vermelho" class="btn"> Vermelho</button>

    </section>

    <h2>Adicionado valores </h2>
    <section class="area_add_sub">
        <button id="btn_mais"> + </button>
        <p id="valor_real"> 0 </p>
        <button id="btn_menos"> - </button>

    </section>    

    <h2>Adicionado Livros </h2>
    <section class="area_livros">
        <input type="text" id="nome_livros">
        <button id="adiciona_livros"> Adicionar </button>
        <ul id="lista_livros">

        </ul>

    </section>

     </main>
    

        

<script src="script.js"></script>




    
</body>
</html>
