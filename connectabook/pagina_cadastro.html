<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pagina_cadastro.css">
    <title>Cadastro</title>
</head>
<body>

    <main>

        <section class="sessao-imagem">
            <img src="img-livros/tela-login.png" alt="Casal numa livraria">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Connecta<span>Livros</span></h1>
                <h2>Troque livros, multiplique histórias, viva novas experiencias</h2>
            </div>

            <form action="#" method="post" id="form-login">
                <label for="email">Informe seu email</label>
                <input type="text" id="email" placeholder="Informe seu email">

                 <label for="nome">Infome seu nome</label>
                <input type="text" id="nome" placeholder="informe seu nome">

                <label for="user">Crie um nome de usuario</label>
                <input type="text" id="user" placeholder="Crie seu usuario">

            
                <div class="area-senha">
                    <div>
                        <label for="senha">Digite uma senha</label>
                        <input type="password" id="senha" placeholder="Informe sua senha">
                    </div>
                    <div>
                        <label for="confirma-senha">Confirme sua senha</label>
                        <input type="password" id="confirma-senha" placeholder="Informe sua senha">     
                    </div>
                </div>

                <button id="btn-acessar">Cadastre-se</button>
                <a href="#" id="link-ja-conta"> Ja possuo conta. Acessar Agora!</a>


            </form>
        </section>


    </main>

    
</body>
</html>
