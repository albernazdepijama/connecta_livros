<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Área de Login</title>
</head>
<body>

    <main>

        <section class="sessao-imagem">
            <img src="img-livros/tela-login.png" alt="Casal numa livraria">
        </section>
        
        <section class="sessao-login">
            <div class="area-titulo">
                <h1>Connecta<span>Livros</span></h1>
                <h2>Troque livros, multiplique histórias, viva novas experiencias</h2>
            </div>

            <form action="#" method="post" id="form-login">
                <label for="email">Usuario ou email</label>
                <input type="text" id="email" placeholder="Informe seu email">

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Informe sua senha">

                <div class="link-senha">
                    <input type="checkbox" id="lembrar-senha">
                    <label for="lembrar-senha">Lembrar Senha</label>

                    <a href="#" id="esqueceu-senha">Esqueceu a senha? </a>
                </div>

                <button id="btn-acessar">Acessar</button>
                <a href="#" id="link-nao-conta"> Ainda nao possui conta</a>


            </form>
        </section>


    </main>

    
</body>
</html>
